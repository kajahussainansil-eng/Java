services:
  - type: web
    name: campusflow-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /app/web_data
      - key: ADMIN_PASSWORD
        generateValue: true
